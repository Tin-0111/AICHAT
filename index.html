<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>AI 채팅</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>🤖 AI 채팅</h1>

    <div class="api-key-box">
      <input type="password" id="apiKey" placeholder="OpenAI API Key 입력" />
      <button onclick="saveKey()">저장</button>
    </div>

    <div id="chat"></div>

    <div class="input-box">
      <input type="text" id="userInput" placeholder="메시지 입력..." />
      <button onclick="sendMessage()">전송</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
