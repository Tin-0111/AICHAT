<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>내 말투 AI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>🧠 내 말투 AI</h1>

    <textarea id="trainData" placeholder="여기에 네가 쓴 문장들 붙여넣기 (줄바꿈 가능)"></textarea>
    <button onclick="train()">학습하기</button>

    <div id="chat"></div>

    <div class="input-box">
      <input id="userInput" placeholder="말 걸어봐" />
      <button onclick="send()">전송</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
